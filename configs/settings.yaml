# Runtime configuration. Secrets come from .env, not here.
# Loaded by rpsg.config.Settings; env vars (RPSG_*) override these values.

paths:
  data_raw: data/raw
  data_interim: data/interim
  data_processed: data/processed
  data_external: data/external
  eval_gold: eval/gold
  eval_runs: eval/runs
  kuzu_db: data/processed/rpsg.kuzu
  vector_index: data/processed/vectors.faiss

models:
  # Provider is inferred from the model id (gpt-* -> OpenAI, claude-* -> Anthropic).
  # Set this to pin it explicitly; see rpsg.llm.get_chat_client.
  provider: null

  # USD per 1M tokens. Used only to turn the token counts in rpsg.llm.usage into a
  # cost figure — nothing here affects model behaviour. Rates change; re-check them
  # before quoting a number, and treat the provider's dashboard as the truth.
  # Recorded 2026-07-30.
  pricing:
    gpt-5.4-nano: {input_per_mtok: 0.20, output_per_mtok: 1.25}
    gpt-5.4-mini: {input_per_mtok: 0.75, output_per_mtok: 4.50}
    # Not currently used: embeddings run locally via sentence-transformers
    # (see the `embeddings` block), so they cost nothing. Kept for the case where
    # you swap the embedder back to the OpenAI one.
    text-embedding-3-small: {input_per_mtok: 0.02, output_per_mtok: 0.0}

  # One-time offline corpus extraction. This is the bulk-call stage (one call per
  # paper section), so it gets the cheapest model.
  extraction_model: gpt-5.4-nano
  # Judge + synthesis. NOTE: same family/tier as each other, so self-preference
  # bias in the judge is NOT mitigated. Acceptable while no comparative claim is
  # being made off the judge scores; revisit before reporting an ablation number.
  judge_model: gpt-5.4-mini
  synthesis_model: gpt-5.4-mini
  # Query-time local inference (Iteration 2 onward). Served via vLLM; not used in the Iteration 1 spine.
  local_inference_model: Qwen/Qwen2.5-14B-Instruct-AWQ

embeddings:
  # SPECTER (original) — tuned for scientific papers and natively packaged for
  # sentence-transformers. NOT allenai/specter2_base: SPECTER2 is an adapter model and
  # sentence-transformers loads only its base weights, silently. Swap for a general
  # embedder (e.g. BAAI/bge-base-en-v1.5, also 768-dim) if you prefer.
  model_name: sentence-transformers/allenai-specter
  dim: 768
  batch_size: 32

extraction:
  # Drop low-confidence nodes/edges instead of writing them to the curated layer.
  # Gated separately: a uniform 0.65 keeps 93% of nodes but only 71% of edges, and
  # edges are far scarcer than nodes. Edges are also pruned transitively when an
  # endpoint node is dropped. 0.0 disables either gate.
  min_node_confidence: 0.65
  min_edge_confidence: 0.5
  # Sections extracted concurrently within a paper. This stage waits on HTTP, it does
  # not compute — a 29-minute sequential run used 0.2% CPU. 1 disables concurrency.
  max_workers: 8

retrieval:
  # Similarity is damped for chunks shorter than this, so short low-content chunks stop
  # crowding out substantive ones. 0 disables. See rpsg.stores.vector_store.
  length_damping_chars: 800

chunking:
  target_tokens: 512        # per chunk (approximate; see rpsg.ingestion.chunking)
  overlap_tokens: 64
  respect_sections: true    # never split a chunk across a section boundary

ingestion:
  s2_fields:                # requested from the Semantic Scholar Graph API
    - paperId
    - externalIds
    - title
    - abstract
    - year
    - venue
    - authors
    - references.paperId
    - openAccessPdf
  max_references_per_paper: 200

eval:
  # Deterministic pass/fail thresholds used in reports.
  calibration:
    min_quadratic_kappa: 0.6   # below this, the judge is untrusted on that criterion
    length_bias_alpha: 0.05    # significance level for the length-bias regression check