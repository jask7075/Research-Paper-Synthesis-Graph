# !! DESIGN RECORD — NOT READ AT RUNTIME !!
# No code loads this file. It documents the intended roster of systems under test so the
# plan is reviewable; the two systems that exist are selected by `scripts/06_run_eval.py`
# via `--system`, and `top_k` is an argparse default there, not a value read from here.
# Keep this honest: do not add a key here describing behaviour that isn't implemented.
#
# `typed_graph` / `citation_graph` arrive in Iterations 2-3.

systems:
  vector_abstract:
    kind: vector
    corpus: abstract
    top_k: 60                 # duplicated as the --top-k default in 06_run_eval.py
    note: "Floor. Shows the abstract-only ceiling."

  vector_fulltext:            # <-- the real baseline to beat
    kind: vector
    corpus: fulltext
    top_k: 60                 # duplicated as the --top-k default in 06_run_eval.py
    note: "Essential baseline. If the typed graph can't beat this on relational queries, the thesis fails."

  citation_graph:
    kind: graph
    typed_edges: false        # untyped `cites` edges only, from S2 references (free)
    max_hops: 2
    note: "Isolates *typing* from *graph-ness* — the ablation that proves typed edges matter."

  typed_graph:                # Iteration 2 onward
    kind: graph
    typed_edges: true
    max_hops: 3
    note: "The system. Not built in the Iteration 1 spine."

# Report scores broken down by query_type — the relational subset is where the graph earns
# its complexity; a natural mix averages that away.
report_by_query_type: true